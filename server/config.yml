# LAMBDA facility server on Tiled.
#
#   export TILED_API_KEY=secret
#   export DATA_ROOT=/absolute/path/to/MyROCrates
#   ./serve.sh
#
# On startup the server:
#   1. Indexes DATA_ROOT/{uuid}/ into facility_index.db (LAMBDA /api/v1/search)
#   2. Registers RO-Crate File nodes in Tiled at /crates/{uuid}/assets/
#
# Tiled tree:
#   /crates/{uuid}                 metadata container
#   /crates/{uuid}/assets/{key}    external bytes for each RO-Crate File node
#
# MyROCrates list processing products via absolute File @ids under beamline
# storage. Those roots must appear in readable_storage (do not copy payloads).

authentication:
  single_user_api_key: ${TILED_API_KEY}

allow_origins:
  - http://127.0.0.1:5173
  - http://localhost:5173
  - http://127.0.0.1:5174
  - http://localhost:5174
  - http://127.0.0.1:5175
  - http://localhost:5175

expose_raw_assets: true

trees:
  - path: /
    tree: catalog
    args:
      uri: "sqlite+aiosqlite:///./var/catalog.db"
      readable_storage:
        - ${DATA_ROOT}
        # Absolute RO-Crate File @ids (FMX / AMX proposal trees)
        - /nsls2/data4/fmx
        - /nsls2/data4/amx
      init_if_not_exists: true
