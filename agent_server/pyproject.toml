[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-agent-server"
version = "0.1.0"
description = "Agent orchestration server with RO-Crate job outputs for TiledMapperLambda."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "httpx",
    "pyyaml",
    "rocrate-tiled",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lambda-agent-server = "agent_server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
