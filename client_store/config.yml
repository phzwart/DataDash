# LAMBDA local client store (Tiled + hydrate API)
#
#   export TILED_API_KEY=secret
#   export DATA_ROOT=/absolute/path/to/client_store/data_root
#   ./serve.sh
#
# Holds crates pulled from a facility server. Dashboard-v2 points here for
# gallery / plots after a cart Pull.

authentication:
  single_user_api_key: ${TILED_API_KEY}

allow_origins:
  - http://127.0.0.1:5175
  - http://localhost:5175
  - http://127.0.0.1:5173
  - http://localhost:5173

expose_raw_assets: true

trees:
  - path: /
    tree: catalog
    args:
      uri: "sqlite+aiosqlite:///./var/catalog.db"
      readable_storage:
        - ${DATA_ROOT}
      init_if_not_exists: true
